<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2165" width="1200" height="2165" role="img" aria-label="Infografik filosofi logo Mie Kopyok Pak Zain, seluruh teks dapat diedit">
  <title>Filosofi Logo Mie Kopyok Pak Zain — Editable SVG</title>
  <desc>Semua label dan paragraf adalah elemen SVG text yang dapat disunting, ilustrasi logo dan panah adalah vektor.</desc>
  <g id="latar-belakang-vektor">
    <rect x="0" y="0" width="1200" height="2165" rx="0" fill="#FCF8F1"/>
