      <circle cx="199" cy="370" r="17" fill="none" stroke="#E6C5A8" stroke-width="1.8"/>
    </g>
    <g id="ilustrasi-mie-samar" opacity="0.24">
      <path d="M 1023 275 C 1073 206 1132 234 1146 288 M 1005 294 C 1054 230 1118 253 1128 314 M 995 310 C 1049 262 1110 278 1118 333 M 978 327 C 1056 298 1102 306 1123 363" stroke="#E6C5A8" fill="none" stroke-width="5" stroke-linecap="round"/>
      <path d="M 975 360 Q 1062 456 1159 361 M 986 360 H 1149" stroke="#E6C5A8" fill="none" stroke-width="6" stroke-linecap="round"/>
