  <g id="diagram-logo-beranotasi" transform="translate(0 -7)">
    <g id="simbol-logo" transform="translate(330 -28) scale(1.05)">
      <path d="M 255 91 L 283 145 L 280 172 L 294 190 L 294 308 L 324 330 L 324 350 L 188 350 L 188 330 L 218 308 L 218 190 L 232 172 L 229 145 Z" fill="#74243E"/>
      <path d="M 117 267 C 103 322 140 380 197 406 C 264 436 354 402 389 340 C 403 315 407 291 400 264" stroke="#BF8964" fill="none" stroke-width="29" stroke-linecap="round"/>
      <path d="M 217 342 L 295 342" stroke="#F3E7D7" fill="none" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="panah-penjelasan">
      <path d="M 343 257 C 392 252 403 271 444 285" stroke="#74243E" fill="none" stroke-width="2.8"/>
      <path d="M 798 124 C 729 106 680 110 628 140" stroke="#74243E" fill="none" stroke-width="2.8"/>
      <path d="M 812 270 C 791 255 779 267 752 288" stroke="#74243E" fill="none" stroke-width="2.8"/>
      <path d="M 820 340 C 764 338 703 339 641 330" stroke="#74243E" fill="none" stroke-width="2.8"/>
      <path d="M 823 418 C 781 426 746 405 721 385" stroke="#74243E" fill="none" stroke-width="2.8"/>
      <circle cx="343" cy="257" r="4" fill="#74243E"/>
      <circle cx="798" cy="124" r="4" fill="#74243E"/>
      <circle cx="812" cy="270" r="4" fill="#74243E"/>
      <circle cx="820" cy="340" r="4" fill="#74243E"/>
      <circle cx="823" cy="418" r="4" fill="#74243E"/>
      <polygon points="444,285 434,282 440,276" fill="#74243E"/>
      <polygon points="628,140 637,135 638,144" fill="#74243E"/>
      <polygon points="752,288 757,276 763,285" fill="#74243E"/>
      <polygon points="641,330 652,325 651,335" fill="#74243E"/>
      <polygon points="721,385 727,396 731,387" fill="#74243E"/>
    </g>
    <g id="teks-keterangan-bisa-diedit">
      <text x="338" y="246" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#74243E" text-anchor="end" id="label-lengkungan-mie">Lengkungan mie</text>
      <text x="817" y="128" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#74243E" id="label-tugu-muda">Tugu Muda Semarang</text>
      <text x="830" y="275" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#74243E" id="label-gerakan-kopyok">Gerakan kopyok</text>
      <text x="837" y="345" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#74243E" id="label-aksen-alas">Aksen alas</text>
      <text x="842" y="422" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#74243E" id="label-bentuk-mangkuk">Bentuk mangkuk</text>
    </g>
    <g id="nama-brand-bisa-diedit">
      <text x="600" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="53" font-weight="bold" fill="#6C1737" text-anchor="middle" letter-spacing="2" id="teks-mie-kopyok">MIE KOPYOK</text>
      <text x="600" y="575" font-family="Noto Serif, Georgia, serif" font-size="55" font-weight="normal" fill="#6C1737" text-anchor="middle" letter-spacing="3" id="teks-pak-zain">PAK ZAIN</text>
      <text x="600" y="627" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#BF8964" text-anchor="middle" letter-spacing="2" id="slogan">BERAKAR DI SEMARANG, BERGERAK BERSAMA CITA RASA</text>
    </g>
  </g>
  <g id="pemisah-bagian">
    <line x1="55" y1="655" x2="570" y2="655" stroke="#74243E" stroke-width="1.4"/>
    <line x1="630" y1="655" x2="1145" y2="655" stroke="#74243E" stroke-width="1.4"/>
    <path d="M 573 655 Q 585 641 600 655 Q 615 669 627 655" stroke="#BF8964" fill="none" stroke-width="2.4"/>
  </g>
  <g id="judul-filosofi">
    <text x="600" y="716" font-family="Noto Serif, Georgia, serif" font-size="41" font-weight="bold" fill="#6C1737" text-anchor="middle" id="judul-filosofi-logo">Filosofi Logo Mie Kopyok Pak Zain</text>
    <text x="600" y="763" font-family="Noto Serif, Georgia, serif" font-size="24" font-weight="bold" fill="#BF8964" text-anchor="middle" id="tagline">Berakar di Semarang, bergerak bersama cita rasa.</text>
  </g>
  <g id="paragraf-pembuka">
    <text x="116" y="807" font-family="Noto Serif, Georgia, serif" font-size="19.3" font-weight="normal" fill="#3E3431">Logo Mie Kopyok Pak Zain merupakan perpaduan antara identitas budaya Semarang, dinamika kuliner</text>
    <text x="116" y="835" font-family="Noto Serif, Georgia, serif" font-size="19.3" font-weight="normal" fill="#3E3431">tradisional, dan semangat usaha keluarga. Setiap elemen dirancang secara sederhana untuk menghadirkan</text>
    <text x="116" y="863" font-family="Noto Serif, Georgia, serif" font-size="19.3" font-weight="normal" fill="#3E3431">karakter yang hangat, berkesan, dan tetap relevan seiring perkembangan zaman.</text>
  </g>
  <g id="penjelasan-elemen">
    <g id="bagian-1">
      <circle cx="99" cy="963" r="42" fill="#F4E7D6"/>
      <g id="ikon-tugu" transform="translate(59 923) scale(0.155)">
        <path d="M 255 91 L 283 145 L 280 172 L 294 190 L 294 308 L 324 330 L 324 350 L 188 350 L 188 330 L 218 308 L 218 190 L 232 172 L 229 145 Z" fill="#74243E"/>
      </g>
      <text x="175" y="936" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#6C1737" id="judul-bagian-1">1. Siluet Tugu Muda — Identitas dan Akar Budaya</text>
      <g id="teks-bagian-1">
        <text x="178" y="967" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Bentuk monumen geometris pada bagian tengah logo terinspirasi dari Tugu Muda, salah satu ikon Kota</text>
        <text x="178" y="993" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Semarang. Siluet yang berdiri tegak melambangkan keteguhan dalam mempertahankan identitas, nilai</text>
        <text x="178" y="1019" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">keluarga, dan kekhasan kuliner lokal. Bentuknya disederhanakan sebagai penghormatan terhadap kota</text>
        <text x="178" y="1045" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">tempat Mie Kopyok Pak Zain tumbuh dan berkembang.</text>
      </g>
      <line x1="55" y1="1083" x2="1145" y2="1083" stroke="#E4D2BE" stroke-width="1"/>
    </g>
    <g id="bagian-2">
      <circle cx="99" cy="1150" r="42" fill="#F4E7D6"/>
      <path d="M 70 1142 C 66 1164 96 1179 118 1170 C 136 1164 132 1149 128 1141" stroke="#BF8964" fill="none" stroke-width="10" stroke-linecap="round"/>
      <text x="175" y="1123" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#6C1737" id="judul-bagian-2">2. Lengkungan Mie — Gerakan Kopyok dan Kebebasan</text>
      <g id="teks-bagian-2">
        <text x="178" y="1154" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Garis melengkung yang mengitari monumen menggambarkan gerakan dinamis dalam proses mengaduk atau</text>
        <text x="178" y="1180" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">mengocok mie, yang menjadi inspirasi istilah kopyok. Lengkungan dibuat terbuka untuk menyimbolkan</text>
        <text x="178" y="1206" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">kebebasan, keterbukaan, dan semangat berkembang. Bentuk ini juga memberi kesan mangkuk sebagai</text>
        <text x="178" y="1232" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">simbol sajian mie khas Semarang.</text>
      </g>
      <line x1="55" y1="1270" x2="1145" y2="1270" stroke="#E4D2BE" stroke-width="1"/>
    </g>
    <g id="bagian-3">
      <circle cx="99" cy="1337" r="42" fill="#F4E7D6"/>
      <path d="M 71 1353 L 71 1336 L 99 1311 L 127 1336 L 127 1353 Z" fill="#74243E"/>
      <path d="M 79 1346 H 119" stroke="#F3E7D7" fill="none" stroke-width="7" stroke-linecap="round"/>
      <text x="175" y="1310" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#6C1737" id="judul-bagian-3">3. Aksen pada Alas Monumen — Kesederhanaan dan Keseimbangan</text>
      <g id="teks-bagian-3">
        <text x="178" y="1341" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Garis pendek berwarna krem pada alas monumen merupakan aksen visual yang memberikan keseimbangan</text>
        <text x="178" y="1367" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">pada keseluruhan simbol. Detail kecil ini melambangkan prinsip bahwa kualitas tidak selalu membutuhkan</text>
        <text x="178" y="1393" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">kerumitan. Kesederhanaan, ketelitian, dan perhatian terhadap detail menjadi bagian dari karakter Mie</text>
        <text x="178" y="1419" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Kopyok Pak Zain.</text>
      </g>
      <line x1="55" y1="1457" x2="1145" y2="1457" stroke="#E4D2BE" stroke-width="1"/>
    </g>
  </g>
  <g id="bagian-4-warna">
    <circle cx="99" cy="1523" r="42" fill="#F4E7D6"/>
    <circle cx="78" cy="1523" r="11" fill="#74243E" stroke="white" stroke-width="1.3"/>
    <circle cx="99" cy="1523" r="11" fill="#BF8964" stroke="white" stroke-width="1.3"/>
    <circle cx="120" cy="1523" r="11" fill="#F3E7D7" stroke="white" stroke-width="1.3"/>
    <text x="175" y="1496" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#6C1737" id="judul-bagian-4">4. Filosofi Warna</text>
    <circle cx="182" cy="1531" r="7" fill="#74243E" stroke="#D0B89C" stroke-width="1"/>
    <text x="198" y="1538" font-family="Noto Serif, Georgia, serif" font-size="17.8" font-weight="bold" fill="#74243E" id="warna-1-judul">Merah Marun — Tradisi dan Keteguhan</text>
    <g id="warna-1-deskripsi">
      <text x="198" y="1560" font-family="Noto Serif, Georgia, serif" font-size="17.2" font-weight="normal" fill="#3E3431">Menggambarkan kehangatan keluarga, karakter yang kuat, dan komitmen mempertahankan identitas kuliner</text>
      <text x="198" y="1584" font-family="Noto Serif, Georgia, serif" font-size="17.2" font-weight="normal" fill="#3E3431">khas Semarang.</text>
    </g>
    <circle cx="182" cy="1615" r="7" fill="#BF8964" stroke="#D0B89C" stroke-width="1"/>
    <text x="198" y="1622" font-family="Noto Serif, Georgia, serif" font-size="17.8" font-weight="bold" fill="#74243E" id="warna-2-judul">Karamel — Kehangatan dan Keakraban</text>
    <g id="warna-2-deskripsi">
      <text x="198" y="1644" font-family="Noto Serif, Georgia, serif" font-size="17.2" font-weight="normal" fill="#3E3431">Mewakili suasana kuliner yang ramah, kedekatan dengan pelanggan, dan kehangatan hidangan yang disajikan.</text>
    </g>
    <circle cx="182" cy="1675" r="7" fill="#F3E7D7" stroke="#D0B89C" stroke-width="1"/>
    <text x="198" y="1682" font-family="Noto Serif, Georgia, serif" font-size="17.8" font-weight="bold" fill="#74243E" id="warna-3-judul">Krem — Kesederhanaan dan Keanggunan</text>
    <g id="warna-3-deskripsi">
      <text x="198" y="1704" font-family="Noto Serif, Georgia, serif" font-size="17.2" font-weight="normal" fill="#3E3431">Memberikan kesan tenang, bersih, dan seimbang. Warna ini menegaskan pendekatan visual yang sederhana</text>
      <text x="198" y="1728" font-family="Noto Serif, Georgia, serif" font-size="17.2" font-weight="normal" fill="#3E3431">namun tetap elegan.</text>
    </g>
    <line x1="55" y1="1765" x2="1145" y2="1765" stroke="#E4D2BE" stroke-width="1"/>
  </g>
  <g id="bagian-5-tipografi">
    <circle cx="99" cy="1834" r="42" fill="#F4E7D6"/>
    <text x="99" y="1848" font-family="Noto Serif, Georgia, serif" font-size="40" font-weight="normal" fill="#74243E" text-anchor="middle">Aa</text>
    <text x="175" y="1809" font-family="Noto Serif, Georgia, serif" font-size="23" font-weight="bold" fill="#6C1737" id="judul-bagian-5">5. Tipografi — Identitas Mie Kopyok Pak Zain</text>
    <g id="teks-bagian-5">
      <text x="178" y="1840" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Perpaduan huruf modern dan serif klasik menghadirkan keseimbangan antara perkembangan zaman dan</text>
      <text x="178" y="1866" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">penghormatan terhadap tradisi. Nama Mie Kopyok menunjukkan identitas kuliner utama, sementara Pak</text>
      <text x="178" y="1892" font-family="Noto Serif, Georgia, serif" font-size="18.1" font-weight="normal" fill="#3E3431">Zain memperkuat karakter personal dan asal-usul usaha keluarga.</text>
    </g>
  </g>
  <g id="makna-keseluruhan">
    <rect x="42" y="1933" width="1116" height="150" rx="18" fill="#F4E8DB"/>
    <g id="ikon-mangkuk-simpulan">
      <path d="M 82 2003 Q 122 2046 159 2003 Z" fill="#74243E"/>
      <path d="M 81 2001 H 159" stroke="#6C1737" fill="none" stroke-width="3"/>
      <path d="M 103 1994 C 94 1981 110 1976 103 1966" stroke="#6C1737" fill="none" stroke-width="2.6"/>
      <path d="M 121 1994 C 112 1981 128 1976 121 1966" stroke="#6C1737" fill="none" stroke-width="2.6"/>
      <path d="M 139 1994 C 130 1981 146 1976 139 1966" stroke="#6C1737" fill="none" stroke-width="2.6"/>
    </g>
    <line x1="183" y1="1956" x2="183" y2="2042" stroke="#74243E" stroke-width="2"/>
    <text x="204" y="1971" font-family="Noto Serif, Georgia, serif" font-size="22" font-weight="bold" fill="#6C1737" id="judul-makna">Makna Keseluruhan</text>
    <g id="teks-makna-keseluruhan">
      <text x="204" y="1998" font-family="Noto Serif, Georgia, serif" font-size="17.5" font-weight="normal" fill="#3E3431">Logo ini bukan sekadar identitas visual, melainkan representasi dari perjalanan Mie Kopyok Pak Zain:</text>
      <text x="204" y="2022" font-family="Noto Serif, Georgia, serif" font-size="17.5" font-weight="normal" fill="#3E3431">sebuah usaha kuliner yang berakar pada budaya Semarang, menjaga kehangatan tradisi keluarga, dan</text>
      <text x="204" y="2046" font-family="Noto Serif, Georgia, serif" font-size="17.5" font-weight="normal" fill="#3E3431">terus bergerak mengikuti perkembangan zaman.</text>
    </g>
  </g>
  <line x1="57" y1="2126" x2="250" y2="2126" stroke="#74243E" stroke-width="1.5"/>
  <line x1="951" y1="2126" x2="1143" y2="2126" stroke="#74243E" stroke-width="1.5"/>
  <text x="600" y="2132" font-family="Noto Serif, Georgia, serif" font-size="18" font-weight="bold" fill="#6C1737" text-anchor="middle" id="penutup-brand">Mie Kopyok Pak Zain — Berakar di Semarang, bergerak bersama cita rasa.</text>
</svg>
